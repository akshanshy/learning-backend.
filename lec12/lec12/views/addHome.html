<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Home</title>
  <link href="/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-96">
    
    <h1 class="text-2xl font-bold text-center text-gray-700 mb-6">
      Register your home
    </h1>

    <form action="/host/add-home" method="POST" class="flex flex-col gap-4">
      
      <input 
        type="text" 
        name="houseName" 
        placeholder="Enter house name"
        class="border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400"
      />

      <button 
        class="bg-red-500 text-white py-3 rounded-lg font-semibold hover:bg-red-600 transition">
        Add Home
      </button>

    </form>

  </div>

</body>
</html>
